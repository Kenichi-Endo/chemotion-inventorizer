[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemotion-sample-manager"
version = "0.3.2"
description = "View, bulk-edit, and print Chemotion samples."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenichi Endo" }]
dependencies = [
  "resvg-py>=0.5,<0.6",
  "chemotion-api==312.0.2",
  "python-magic-bin==0.4.14; sys_platform == 'win32'",
]
scripts = { chemotion-sample-manager = "chemotion_sample_manager.__main__:main" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
standalone = [
  "pyinstaller>=6.16,<7",
]
dev = [
  "pytest>=8",
  "build>=1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
