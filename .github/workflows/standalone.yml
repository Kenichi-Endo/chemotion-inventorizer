name: Standalone apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build_standalone.py'
      - 'pyproject.toml'
      - 'Chemotion Inventorizer.app/Contents/Resources/**'
      - '.github/workflows/standalone.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            artifact: macos-apple-silicon
          - os: macos-15-intel
            architecture: x64
            artifact: macos-intel
          - os: windows-latest
            architecture: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -e ".[dev,standalone]"
      - run: python -m pytest -q
      - run: python scripts/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: chemotion-inventorizer-${{ matrix.artifact }}
          path: dist/standalone/*.zip
          if-no-files-found: error
