name: Standalone apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build_standalone.py'
      - 'pyproject.toml'
      - 'Chemotion Inventorizer.app/Contents/Resources/**'
      - '.github/workflows/standalone.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            artifact: macos-apple-silicon
          - os: macos-15-intel
            architecture: x64
            artifact: macos-intel
          - os: windows-latest
            architecture: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: ${{ matrix.architecture }}
      - if: runner.os == 'macOS'
        run: brew install libmagic
      - run: python -m pip install -e ".[dev,standalone]"
      - if: runner.os == 'Windows'
        run: python -c "import sys; from chemotion_inventorizer.bootstrap import ensure_libmagic; ensure_libmagic(sys.executable, sys.stdout)"
      - run: >-
          python -u -c "import faulthandler, pytest;
          faulthandler.dump_traceback_later(60, exit=True);
          raise SystemExit(pytest.main(['-vv', '-s']))"
        timeout-minutes: 5
      - run: python scripts/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: chemotion-inventorizer-${{ matrix.artifact }}
          path: dist/standalone/*.zip
          if-no-files-found: error
