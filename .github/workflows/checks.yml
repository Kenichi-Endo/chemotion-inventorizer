name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'macOS'
        run: brew install libmagic
      - run: python -m pip install -e ".[dev]"
      - if: runner.os == 'Windows'
        run: python -c "import sys; from chemotion_inventorizer.bootstrap import ensure_libmagic; ensure_libmagic(sys.executable, sys.stdout)"
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: python -m build
